      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "dist/MicrosoftEdgeWebview2Setup.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\petal.iss

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/petal.exe dist/portable/
          "" | Out-File -Encoding ascii dist/portable/portable.txt
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/Petal-portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: petal-windows
          path: |
            dist/Petal-Setup-*.exe
            dist/Petal-portable-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Petal-Setup-*.exe
            dist/Petal-portable-*.zip
