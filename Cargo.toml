[package]
name = "petal"
version = "1.3.0"
description = "Petal: браузер с вкладками, саундпад, калькулятор и колесо удачи"
edition = "2021"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
getrandom = "0.2"
ehttp = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
rfd = "0.18.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "recording", "experimental", "flac", "mp3", "vorbis", "wav"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
wry = "0.57.2"
