[package]
name = "petal"
version = "1.0.1"
description = "Petal: браузер с вкладками, саундпад, калькулятор и колесо удачи"
edition = "2021"

[dependencies]
eframe = "0.31"
getrandom = "0.2"
rfd = "0.18.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "recording", "experimental", "flac", "mp3", "vorbis", "wav"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
wry = "0.57.2"
